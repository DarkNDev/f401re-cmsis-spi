[env]
platform = ststm32
board = genericSTM32F401RE
framework = cmsis
debug_tool = custom
debug_port = localhost:3333
debug_init_cmds =
  target extended-remote $DEBUG_PORT
  $INIT_BREAK
  $LOAD_CMDS

[env:1_blink_polling]
build_src_filter = +<1_blink_polling/>

[env:2_blink_interrupt]
build_src_filter = +<2_blink_interrupt/>

[env:3_switch_led_1]
build_src_filter = +<3_switch_led_1/>
; debug_extra_cmds =
;     display/3tb &spi.tx
;     display/3tb &spi.rx
;     display/tb &spi.tx_idx
;     display/tb &spi.rx_idx
;     display/tb &spi.busy

[env:4_switch_led_2]
build_src_filter = +<4_switch_led_2/>

[env:5_switch_exti]
build_src_filter = +<5_switch_exti/>